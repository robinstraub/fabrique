[package]
name = "fabrique"
version = "0.3.1"
edition = "2024"
description = "SQL-first, type-safe, ergonomic database toolkit for Rust"
license = "MIT"
repository = "https://github.com/robinstraub/fabrique"
homepage = "https://github.com/robinstraub/fabrique"
documentation = "https://docs.rs/fabrique"

[package.metadata.docs.rs]
features = ["testing", "sqlite"]

[features]
default = []
testing = ["dep:fake", "fabrique-core/testing", "fabrique-derive/testing"]
postgres = ["fabrique-core/postgres", "fabrique-derive/postgres"]
mysql = ["fabrique-core/mysql", "fabrique-derive/mysql"]
sqlite = ["fabrique-core/sqlite", "fabrique-derive/sqlite"]

[dependencies]
fabrique-core = { path = "../fabrique-core", version = "0.3.1" }
fabrique-derive = { path = "../fabrique-derive", version = "0.3.1" }
fake = { workspace = true, optional = true }

[dev-dependencies]
cargo-husky = { workspace = true }
chrono = "0.4"
fabrique = { path = "." }
strum = "0.27"
strum_macros = "0.27"
tokio = { version = "1.0", features = ["rt", "macros"] }
tokio-test = "0.4"
sqlx = { workspace = true, features = ["runtime-tokio", "uuid", "chrono"] }
uuid = { version = "1", features = ["v4"] }
