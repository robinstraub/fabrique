[package]
name = "fabrique"
version = "0.1.0"
edition = "2024"
description = "A lightweight ORM for Rust inspired by Laravel Eloquent, with built-in factories for testing"
license = "MIT"
repository = "https://github.com/robinstraub/fabrique"
homepage = "https://github.com/robinstraub/fabrique"
documentation = "https://docs.rs/fabrique"

[features]
sqlx = ["fabrique-core/sqlx", "fabrique-derive/sqlx"]

[dependencies]
fabrique-core = { path = "../fabrique-core", version = "0.1.0" }
fabrique-derive = { path = "../fabrique-derive", version = "0.1.0" }

[dev-dependencies]
fabrique = { path = ".", features = ["sqlx"] }
strum = "0.27"
strum_macros = "0.27"
tokio = { version = "1.0", features = ["rt", "macros"] }
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "uuid"] }
uuid = "1"
