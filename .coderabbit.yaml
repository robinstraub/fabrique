# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

reviews:
  profile: assertive
  auto_review:
    ignore_title_keywords:
      - "release-plz"
  path_filters:
    - "!**/*.js"
    - "!CHANGELOG.md"

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "docs/README.md"
