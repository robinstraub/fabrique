[package]
name = "fabrique-derive"
version = "0.3.1"
edition = "2024"
description = "Derive macros for Fabrique"
license = "MIT"
repository = "https://github.com/robinstraub/fabrique"
homepage = "https://github.com/robinstraub/fabrique"
documentation = "https://docs.rs/fabrique-derive"

[package.metadata.docs.rs]
features = ["sqlite", "testing"]

[features]
testing = []
postgres = ["fabrique-core/postgres", "sqlx/postgres"]
mysql = ["fabrique-core/mysql", "sqlx/mysql"]
sqlite = ["fabrique-core/sqlite", "sqlx/sqlite"]

[lib]
proc-macro = true

[dependencies]
darling = "0.21"
fabrique-core = { path = "../fabrique-core", version = "0.3.1" }
heck = "0.5"
pluralizer = "0.4"
proc-macro2 = "1.0"
quote = "1.0"
sqlx = { workspace = true, features = ["runtime-tokio", "uuid"] }
syn = { version = "2.0", features = ["extra-traits"] }
thiserror = "2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(coverage,coverage_nightly)',
] }

[dev-dependencies]
fabrique = { path = "../fabrique" }
fabrique-derive = { path = "." }
tokio = { version = "1", features = ["rt"] }
trybuild = "1.0"
uuid = "1"
