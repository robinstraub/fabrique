name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  codestyle:
    name: Codestyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: |
          cargo clippy --workspace --all-targets --features sqlite -- -D warnings
          cargo clippy --workspace --all-targets --features postgres --exclude ui-tests -- -D warnings
          cargo clippy --workspace --all-targets --features mysql --exclude ui-tests -- -D warnings

  test-postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage
        run: cargo llvm-cov --features postgres --workspace --exclude ui-tests --lcov --output-path lcov-postgres.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov-postgres
          path: lcov-postgres.info

  test-sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage
        run: cargo llvm-cov --features sqlite --workspace --exclude ui-tests --lcov --output-path lcov-sqlite.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov-sqlite
          path: lcov-sqlite.info

  test-mysql:
    name: Tests (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: fabrique
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306
    env:
      DATABASE_URL: mysql://root:mysql@localhost:3306/fabrique
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage
        run: cargo llvm-cov --features mysql --workspace --exclude ui-tests --lcov --output-path lcov-mysql.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov-mysql
          path: lcov-mysql.info

  test-ui:
    name: Tests (UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run UI tests with coverage
        run: cargo llvm-cov -p ui-tests --lcov --output-path lcov-ui.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov-ui
          path: lcov-ui.info

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [test-postgres, test-sqlite, test-mysql, test-ui]
    steps:
      - uses: actions/checkout@v5

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lcov-*
          merge-multiple: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov-postgres.info,lcov-sqlite.info,lcov-mysql.info,lcov-ui.info
          fail_ci_if_error: true

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly-2025-12-01
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install mdBook and preprocessors
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook,mdbook-mermaid

      - name: Build dependencies for doctests
        run: cargo build --features sqlite

      - name: Build mdBook
        run: mdbook build docs

      - name: Test mdBook code examples
        run: mdbook test docs -L target/debug/deps
