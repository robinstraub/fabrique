name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  codestyle-rust:
    name: Codestyle (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install nightly for rustfmt
        run: rustup toolchain install nightly --component rustfmt

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

      - name: Run clippy
        run: |
          cargo clippy --workspace --lib --features sqlite,postgres,mysql,testing --exclude ui-tests -- -D warnings
          cargo clippy --workspace --all-targets --features sqlite,testing -- -D warnings

  build-stable:
    name: Build (Stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build with stable
        run: |
          cargo check --workspace --features sqlite,postgres,mysql,testing --exclude ui-tests
          cargo check --workspace --features sqlite,testing --package ui-tests

  codestyle-markdown:
    name: Codestyle (Markdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint markdown
        run: npx --yes markdownlint-cli2@0.20.0

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: fabrique
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306
    env:
      POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
      MYSQL_URL: mysql://root:mysql@localhost:3306/fabrique
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage
        run: cargo llvm-cov --lib --tests --features sqlite,postgres,mysql,testing --workspace --exclude ui-tests --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true

  test-ui:
    name: Tests (UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run UI tests
        run: cargo test -p ui-tests

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install mdBook and preprocessors
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook,mdbook-mermaid

      - name: Build dependencies for doctests
        run: cargo build --features sqlite,testing

      - name: Build mdBook
        run: mdbook build docs

      - name: Test mdBook code examples
        run: CARGO_MANIFEST_DIR=$PWD/docs mdbook test docs -L target/debug/deps
